<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="50%" stop-color="#0A0A1A"/>
      <stop offset="100%" stop-color="#11112A"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>
    <linearGradient id="vGradVert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative glowing orbs -->
  <circle cx="150" cy="150" r="250" fill="#00D9FF" opacity="0.04" filter="url(#glowSoft)"/>
  <circle cx="1050" cy="480" r="300" fill="#FF00E5" opacity="0.04" filter="url(#glowSoft)"/>
  <circle cx="600" cy="315" r="200" fill="#8B5CF6" opacity="0.03" filter="url(#glowSoft)"/>

  <!-- Top decorative line -->
  <line x1="100" y1="100" x2="400" y2="100" stroke="#00D9FF" stroke-width="1" opacity="0.3"/>
  <line x1="420" y1="100" x2="1100" y2="100" stroke="url(#vGrad)" stroke-width="1" opacity="0.15"/>

  <!-- V Mark -->
  <path d="M 440 240 L 600 380 L 760 240" fill="none" stroke="url(#vGradVert)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowBig)"/>

  <!-- Upward arrow in V -->
  <line x1="600" y1="360" x2="600" y2="270" stroke="#E8E8FF" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <polyline points="592,280 600,270 608,280" fill="none" stroke="#E8E8FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- VeneRate text -->
  <text x="600" y="460" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#E8E8FF" letter-spacing="4">VeneRate</text>

  <!-- Subtitle -->
  <text x="600" y="510" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#9999C0" letter-spacing="6">MONITOR DE DIVISAS EN TIEMPO REAL</text>

  <!-- Bottom decorative line -->
  <line x1="100" y1="540" x2="400" y2="540" stroke="#FF00E5" stroke-width="1" opacity="0.3"/>
  <line x1="420" y1="540" x2="1100" y2="540" stroke="url(#vGrad)" stroke-width="1" opacity="0.15"/>

  <!-- Small badge -->
  <rect x="525" y="535" width="150" height="28" rx="14" fill="#00D9FF" opacity="0.1"/>
  <text x="600" y="554" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#00D9FF" letter-spacing="2">BCV · BINANCE P2P · EURO</text>
</svg>
