<svg viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="50%" stop-color="#0A0A1A"/>
      <stop offset="100%" stop-color="#11112A"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>
  <rect width="360" height="640" fill="url(#bg)"/>
  <circle cx="40" cy="100" r="120" fill="#00D9FF" opacity="0.06" filter="url(#soft)"/>
  <circle cx="320" cy="520" r="150" fill="#FF00E5" opacity="0.06" filter="url(#soft)"/>

  <rect x="16" y="16" width="328" height="44" rx="12" fill="#FFFFFF" opacity="0.05"/>
  <rect x="180" y="32" width="90" height="10" rx="5" fill="#FFFFFF" opacity="0.15"/>

  <!-- Timeframe pills -->
  <rect x="16" y="80" width="80" height="32" rx="16" fill="#00D9FF" opacity="0.3"/>
  <rect x="104" y="80" width="80" height="32" rx="16" fill="#FFFFFF" opacity="0.06"/>
  <rect x="192" y="80" width="80" height="32" rx="16" fill="#FFFFFF" opacity="0.06"/>

  <!-- Chart area -->
  <rect x="16" y="128" width="328" height="280" rx="20" fill="#FFFFFF" opacity="0.05"/>
  <polyline points="40,360 90,330 140,340 190,290 240,300 290,250 320,240" fill="none" stroke="#00D9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="40,360 90,345 140,350 190,320 240,325 290,300 320,295" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <rect x="40" y="248" width="280" height="120" fill="#00D9FF" opacity="0.06"/>

  <!-- Stats row -->
  <rect x="16" y="424" width="160" height="80" rx="16" fill="#FFFFFF" opacity="0.05"/>
  <rect x="28" y="440" width="80" height="10" rx="5" fill="#8B5CF6" opacity="0.6"/>
  <rect x="28" y="462" width="110" height="18" rx="9" fill="#FFFFFF" opacity="0.2"/>
  <rect x="184" y="424" width="160" height="80" rx="16" fill="#FFFFFF" opacity="0.05"/>
  <rect x="196" y="440" width="80" height="10" rx="5" fill="#FF00E5" opacity="0.6"/>
  <rect x="196" y="462" width="110" height="18" rx="9" fill="#FFFFFF" opacity="0.2"/>

  <rect x="60" y="580" width="240" height="44" rx="22" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="120" cy="602" r="8" fill="#00D9FF" opacity="0.5"/>
  <circle cx="180" cy="602" r="8" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="240" cy="602" r="8" fill="#FFFFFF" opacity="0.2"/>

  <text x="180" y="555" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#9999C0" letter-spacing="1">CAPTURA — HISTORIAL</text>
